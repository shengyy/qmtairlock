name: Manual checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.10'
          enable-cache: false
      - run: uv sync --locked
      - run: uv run --locked ruff check src scripts tests
      - run: uv run --locked ruff format --check src scripts tests
      - run: uv run --locked python scripts/check_repository.py
      - run: uv run --locked python scripts/check_host.py
      - run: uv run --locked pytest -q
      - run: uv run --locked python scripts/build_strategy.py
      - run: uv build
      - run: git diff --check
