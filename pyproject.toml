[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qmtairlock"
version = "0.1.0"
description = "Named-pipe trading and market data RPC for the QMT strategy host"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "shengyy"}]
dependencies = []

[project.optional-dependencies]
data = ["pandas>=1.5", "pyarrow>=12"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "pandas>=1.5", "pyarrow>=12", "build>=1"]

[project.urls]
Homepage = "https://github.com/shengyy/qmtairlock"
Repository = "https://github.com/shengyy/qmtairlock.git"
Issues = "https://github.com/shengyy/qmtairlock/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
